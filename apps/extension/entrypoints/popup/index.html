<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PrivacyLens</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 240px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0B1120;
      color: #E2E8F0;
      font-size: 13px;
    }

    .popup-header {
      padding: 15px 15px 12px;
      border-bottom: 1px solid #1e2d42;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .popup-logo {
      width: 34px;
      height: 34px;
      background: rgba(79,127,255,0.10);
      border: 1px solid rgba(79,127,255,0.25);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      flex-shrink: 0;
    }

    .popup-title { font-size: 15px; font-weight: 700; line-height: 1.2; }
    .popup-subtitle { font-size: 10px; color: #475569; margin-top: 1px; }

    .popup-body { padding: 12px; display: flex; flex-direction: column; gap: 8px; }

    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      background: #111827;
      border: 1px solid #1e2d42;
      border-radius: 8px;
    }
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #475569;
      flex-shrink: 0;
      transition: background 0.3s, box-shadow 0.3s;
    }
    .status-dot.connected { background: #10B981; box-shadow: 0 0 6px rgba(16,185,129,0.5); }
    .status-dot.error { background: #EF4444; }
    .status-label { font-size: 12px; color: #94A3B8; }

    .btn-primary {
      background: #4F7FFF;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: opacity 0.15s;
    }
    .btn-primary:hover { opacity: 0.88; }

    .btn-ghost {
      background: #111827;
      color: #94A3B8;
      border: 1px solid #1e2d42;
      border-radius: 8px;
      padding: 9px;
      font-size: 12px;
      cursor: pointer;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: color 0.15s, border-color 0.15s;
    }
    .btn-ghost:hover { color: #E2E8F0; border-color: rgba(79,127,255,0.3); }

    .footer {
      text-align: center;
      font-size: 10px;
      color: #2D3F55;
      padding: 0 12px 12px;
    }
  </style>
</head>
<body>
  <div class="popup-header">
    <div class="popup-logo">🛡</div>
    <div>
      <div class="popup-title">PrivacyLens</div>
      <div class="popup-subtitle">Privacy-preserving web agent</div>
    </div>
  </div>

  <div class="popup-body">
    <div class="status-row">
      <div class="status-dot" id="status-dot"></div>
      <span class="status-label" id="status-label">Checking gateway...</span>
    </div>

    <button class="btn-primary" id="open-panel-btn">🛡&nbsp; Open Side Panel</button>
    <button class="btn-ghost" id="open-settings-btn">⚙&nbsp; Settings</button>
  </div>

  <div class="footer">Compute locally · Reason on sanitized data</div>

  <script src="popup.js" type="module"></script>
</body>
</html>
