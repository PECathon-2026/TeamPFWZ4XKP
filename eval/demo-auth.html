<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PrivacyLens Demo — Scenario S2: Authentication & 2FA</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 500px; margin: 40px auto; padding: 24px; background: #f8fafc; color: #1e293b; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
    h1 { color: #0284c7; margin-bottom: 8px; font-size: 20px; }
    p.subtitle { color: #64748b; font-size: 13px; margin-bottom: 20px; }
    .card { background: #fff; padding: 18px; border-radius: 8px; border: 1px solid #e2e8f0; }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 12px; font-weight: 600; color: #475569; margin-bottom: 4px; }
    input[type=email], input[type=password], input[type=text] {
      width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; box-sizing: border-box;
    }
    .btn { background: #0284c7; color: #fff; font-size: 13px; font-weight: 600; border: none; border-radius: 6px; padding: 10px 14px; width: 100%; cursor: pointer; margin-top: 6px; }
    .btn:hover { background: #0369a1; }
    .otp-notice { background: #eff6ff; border: 1px solid #bfdbfe; color: #1e40af; padding: 8px 12px; border-radius: 6px; font-size: 12px; margin-bottom: 12px; }
  </style>
</head>
<body>
  <h1>Account Security Verification</h1>
  <p class="subtitle">Scenario S2: Automated login where password and 2FA OTP codes are never sent unredacted to cloud models.</p>

  <div class="card">
    <div class="otp-notice">
      Sent a 6-digit one-time verification code to <strong>alice.customer@example.com</strong>
    </div>

    <form action="/auth/verify-otp" method="POST">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" value="alice.customer@example.com" disabled>
      </div>

      <div class="form-group">
        <label>Account Password</label>
        <input type="password" id="password-input" autocomplete="current-password" value="SuperSecretPassword123!">
      </div>

      <div class="form-group">
        <label>One-Time Verification Code (OTP)</label>
        <input type="text" id="otp-input" autocomplete="one-time-code" placeholder="Enter 6-digit code" value="829104">
      </div>

      <button id="submit-btn" class="btn" type="submit">Verify and Log In</button>
    </form>
  </div>
</body>
</html>
