<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PrivacyLens Demo Page — E-Commerce & KYC Checkout</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 650px; margin: 40px auto; padding: 24px; background: #f8fafc; color: #1e293b; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
    h1 { color: #0284c7; margin-bottom: 8px; font-size: 22px; }
    p.subtitle { color: #64748b; font-size: 14px; margin-bottom: 24px; }
    .card { background: #fff; padding: 18px; border-radius: 8px; border: 1px solid #e2e8f0; margin-bottom: 16px; }
    .card h2 { font-size: 16px; margin-bottom: 12px; color: #334155; }
    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 12px; font-weight: 600; color: #475569; margin-bottom: 4px; }
    input[type=text], input[type=email], input[type=password], input[type=tel] {
      width: 100%; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; box-sizing: border-box;
    }
    .grid { display: grid; grid-template-columns: 2fr 1fr; gap: 12px; }
    .btn-pay { background: #0284c7; color: #fff; font-size: 14px; font-weight: 600; border: none; border-radius: 6px; padding: 12px; width: 100%; cursor: pointer; margin-top: 8px; }
    .btn-pay:hover { background: #0369a1; }
    .cheapest-badge { background: #dcfce7; color: #15803d; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; float: right; }
  </style>
</head>
<body>
  <h1>Checkout Demo Store</h1>
  <p class="subtitle">Open the PrivacyLens Extension Side Panel on this page to test local sanitization, canary containment, and human approval gates.</p>

  <div class="card">
    <h2>1. Selected Item</h2>
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <span>Smart Ergonomic Mouse Pad</span>
      <div>
        <span class="cheapest-badge">Cheapest Item</span>
        <strong style="margin-left: 8px;">$9.99</strong>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>2. Customer Contact & KYC (Sensitive Data)</h2>
    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="email" value="alice.customer@example.com">
    </div>
    <div class="grid">
      <div class="form-group">
        <label>Phone Number (India)</label>
        <input type="tel" id="phone" value="+91 9876543210">
      </div>
      <div class="form-group">
        <label>PAN Card (KYC)</label>
        <input type="text" id="pan" value="ABCPE1234F">
      </div>
    </div>
  </div>

  <div class="card">
    <h2>3. Payment Details (Card & Passwords)</h2>
    <div class="form-group">
      <label>Card Number (Luhn Valid)</label>
      <input type="text" id="cardNumber" autocomplete="cc-number" value="4111-1111-1111-1111">
    </div>
    <div class="grid">
      <div class="form-group">
        <label>Card Expiry</label>
        <input type="text" id="expiry" value="08/29">
      </div>
      <div class="form-group">
        <label>CVV</label>
        <input type="text" id="cvv" autocomplete="cc-csc" value="849">
      </div>
    </div>
    <div class="form-group">
      <label>Account Password (Never read by PrivacyLens)</label>
      <input type="password" id="password" value="SuperSecretPassword123!">
    </div>

    <button id="pay-btn" class="btn-pay" type="submit">Pay Now ($9.99)</button>
  </div>
</body>
</html>
