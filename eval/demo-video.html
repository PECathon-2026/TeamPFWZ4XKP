<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PrivacyLens Demo — Scenario S4: Video Conferencing & Default-Deny</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 650px; margin: 40px auto; padding: 24px; background: #0f172a; color: #f8fafc; border-radius: 12px; }
    h1 { color: #38bdf8; font-size: 20px; margin-bottom: 6px; }
    p.subtitle { color: #94a3b8; font-size: 13px; margin-bottom: 20px; }
    .video-tile { width: 100%; height: 260px; background: #1e293b; border: 2px dashed #475569; border-radius: 8px; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; margin-bottom: 16px; overflow: hidden; }
    video { width: 100%; height: 100%; object-fit: cover; }
    .participant-tag { position: absolute; bottom: 12px; left: 12px; background: rgba(0,0,0,0.7); padding: 4px 10px; border-radius: 4px; font-size: 12px; }
    .controls { display: flex; gap: 10px; justify-content: center; }
    .btn { background: #38bdf8; color: #0f172a; font-size: 13px; font-weight: 600; border: none; border-radius: 6px; padding: 10px 16px; cursor: pointer; }
    .btn:hover { background: #7dd3fc; }
    .btn-danger { background: #ef4444; color: #fff; }
    .badge { background: #0284c7; color: #fff; font-size: 10px; padding: 2px 6px; border-radius: 4px; margin-left: 6px; }
  </style>
</head>
<body>
  <h1>Executive Video Sync (Private Room) <span class="badge">Scenario S4</span></h1>
  <p class="subtitle">Demonstrating FR-B5 Default-Deny: Video tiles & faces are automatically blanked out with solid opaque fill so raw visual feeds never leave the browser.</p>

  <div class="video-tile">
    <video autoplay muted playsinline poster="">
      <!-- Mock video feed -->
    </video>
    <div class="participant-tag">
      Host: <strong id="host-email">executive.ceo@enterprise-partner.internal</strong>
    </div>
  </div>

  <div class="controls">
    <button id="mute-btn" class="btn">Mute Microphone</button>
    <button id="chat-btn" class="btn">Open Chat</button>
    <button id="leave-btn" class="btn btn-danger">Leave Call</button>
  </div>
</body>
</html>
