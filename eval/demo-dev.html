<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PrivacyLens Demo — Scenario S5: Developer Settings</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 650px; margin: 40px auto; padding: 24px; background: #f8fafc; color: #1e293b; border-radius: 12px; }
    h1 { color: #0284c7; font-size: 20px; margin-bottom: 6px; }
    p.subtitle { color: #64748b; font-size: 13px; margin-bottom: 20px; }
    .card { background: #fff; padding: 18px; border-radius: 8px; border: 1px solid #e2e8f0; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 12px; font-weight: 600; color: #475569; margin-bottom: 4px; }
    input[type=text], input[type=url] { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; box-sizing: border-box; }
    .key-box { background: #0f172a; color: #38bdf8; padding: 12px; border-radius: 6px; font-family: monospace; font-size: 13px; margin-bottom: 14px; word-break: break-all; }
    .btn { background: #0284c7; color: #fff; font-size: 13px; font-weight: 600; border: none; border-radius: 6px; padding: 10px 16px; cursor: pointer; }
    .btn:hover { background: #0369a1; }
  </style>
</head>
<body>
  <h1>Developer Settings & API Keys</h1>
  <p class="subtitle">Scenario S5: Configuring webhooks and portal settings without sending internal API tokens or staging keys to external models.</p>

  <div class="card">
    <div class="form-group">
      <label>Production API Secret Key (Sensitive Token)</label>
      <div class="key-box" id="key-val">sk-proj-prod9948271048201948271048201948</div>
    </div>

    <form action="/settings/webhook" method="POST">
      <div class="form-group">
        <label>Webhook Notification URL</label>
        <input type="url" id="webhook-url" value="https://staging.internal.corp/webhooks/listener">
      </div>

      <div class="form-group">
        <label>Secret Signing Header</label>
        <input type="text" id="header-val" value="X-Signature-Key">
      </div>

      <button id="save-btn" class="btn" type="submit">Save Webhook Configuration</button>
    </form>
  </div>
</body>
</html>
